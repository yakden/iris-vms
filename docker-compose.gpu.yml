# GPU override for the distribution stack — merged in by the installer ONLY when an
# NVIDIA GPU + the NVIDIA Container Toolkit are present.
#   docker compose -f docker-compose.dist.yml -f docker-compose.gpu.yml up -d
services:
  vms:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
